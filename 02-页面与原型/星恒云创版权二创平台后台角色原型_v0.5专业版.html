<!doctype html>
<html lang="zh-CN">
<head>

<title>星衍树｜文化版权运营平台 v0.5 专业版原型</title>
<style>
:root{--deep:#073763;--deep-2:#0b4778;--blue:#0b6fb8;--blue-2:#0b5ca5;--pale:#eef7fb;--paper:#f8faf9;--card:#fff;--ink:#193247;--muted:#708596;--line:#dce7ed;--ok:#168a70;--warn:#b97916;--danger:#c65353;--shadow:0 12px 30px rgba(14,53,83,.08)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:14px/1.5 "Microsoft YaHei","PingFang SC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;grid-template-columns:42% 58%;background:var(--paper)}
.brand-panel{position:relative;overflow:hidden;background:var(--deep);color:#fff;padding:54px 7vw;display:flex;flex-direction:column;justify-content:space-between;min-height:720px}
.brand-panel:after{content:"";position:absolute;left:-10%;right:-10%;bottom:7%;height:180px;border-top:1px solid #8fc8ea55;border-radius:50%;transform:rotate(-7deg);box-shadow:0 24px 0 #8fc8ea20,0 49px 0 #8fc8ea16,0 76px 0 #8fc8ea12,0 105px 0 #8fc8ea0b}
.brand-mark{position:relative;z-index:1;display:flex;align-items:center;gap:14px}.brand-mark .symbol{width:40px;height:40px;border:2px solid #fff;border-radius:50%;position:relative}.brand-mark .symbol:before,.brand-mark .symbol:after{content:"";position:absolute;left:6px;right:6px;height:1px;background:#fff;transform:rotate(-18deg)}.brand-mark .symbol:before{top:15px}.brand-mark .symbol:after{top:23px}.brand-name{font-size:28px;letter-spacing:.16em;font-weight:700}.brand-en{font-size:10px;letter-spacing:.22em;color:#bcd9ec;margin-top:2px}
.brand-copy{position:relative;z-index:1;margin-top:70px}.brand-copy h1{font:38px/1.25 Georgia,"Songti SC",serif;letter-spacing:.12em;margin:0 0 24px}.brand-copy p{color:#c2d9e8;letter-spacing:.22em;margin:0}.brand-meta{position:relative;z-index:1;color:#bcd9ec;letter-spacing:.18em}.brand-meta strong{display:block;color:#fff;font-size:12px;margin-bottom:8px}
.lighthouse{position:absolute;z-index:2;right:15%;bottom:24%;width:54px;height:130px}.tower{position:absolute;bottom:0;left:14px;width:26px;height:90px;background:linear-gradient(90deg,#dceaf1,#fff 45%,#bdd5e2);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}.lamp{position:absolute;bottom:89px;left:10px;width:34px;height:22px;border:2px solid #fff;border-bottom:0;border-radius:3px 3px 0 0}.light{position:absolute;bottom:111px;left:18px;width:18px;height:8px;background:#fff;border-radius:8px;box-shadow:0 0 22px 8px #d8f3ff}.shore{position:absolute;bottom:0;left:-35px;width:125px;height:10px;border-top:2px solid #dcefff;border-radius:50%}
.login-main{display:flex;align-items:center;justify-content:center;padding:44px}.login-card{width:min(480px,100%);background:#fff;border:1px solid var(--line);padding:48px 52px;box-shadow:var(--shadow)}.eyebrow{color:var(--blue);font-size:12px;letter-spacing:.18em}.login-card h2{font:30px/1.3 Georgia,"Songti SC",serif;margin:10px 0 6px;color:var(--deep)}.subtitle{color:var(--muted);margin:0 0 34px}.field{margin:18px 0}.field label{display:block;color:var(--ink);font-weight:700;margin-bottom:7px}.input-wrap{display:flex;align-items:center;border:1px solid var(--line);background:#fff;height:46px}.input-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px #0b6fb818}.input-wrap input{border:0;outline:0;width:100%;height:100%;padding:0 14px;background:transparent}.captcha-row{display:grid;grid-template-columns:1fr 116px 44px;gap:8px}.captcha{height:46px;background:#edf5fa;color:var(--blue);display:grid;place-items:center;font-weight:700;letter-spacing:.28em;border:1px solid var(--line)}.icon-btn{border:1px solid var(--line);background:#fff;color:var(--blue)}.primary{border:0;background:var(--blue);color:#fff;height:48px;width:100%;font-weight:700;letter-spacing:.12em}.primary:hover{background:var(--blue-2)}.login-links{display:flex;justify-content:space-between;margin-top:18px;color:var(--blue);font-size:13px}.login-foot{border-top:1px solid var(--line);margin-top:32px;padding-top:18px;text-align:center;color:#9aabb7;font-size:12px;letter-spacing:.15em}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--deep);color:#d8e9f3;padding:25px 16px;display:flex;flex-direction:column}.side-logo{padding:0 14px 30px;border-bottom:1px solid #ffffff18}.side-logo .brand-name{font-size:22px}.side-logo small{display:block;color:#a8c9dd;margin-top:8px;letter-spacing:.18em}.nav-title{font-size:11px;color:#8eb5cd;letter-spacing:.18em;padding:25px 14px 9px}.nav button{width:100%;border:0;background:transparent;text-align:left;color:#c6dce8;padding:11px 14px;margin:2px 0;border-radius:4px}.nav button:hover,.nav button.active{background:#0b6fb8;color:#fff}.nav button span{margin-right:10px;color:#9fcce7}.side-bottom{margin-top:auto;border-top:1px solid #ffffff18;padding:20px 14px;color:#9fc1d4;font-size:12px}.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px}.crumb{color:var(--muted);font-size:13px}.user{display:flex;align-items:center;gap:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#d9edf8;color:var(--deep);display:grid;place-items:center;font-weight:700}.content{max-width:1500px;padding:38px 44px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px}.page-head h1{font:32px/1.25 Georgia,"Songti SC",serif;color:var(--deep);margin:8px 0}.page-head p{color:var(--muted);margin:0}.date{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.stat,.panel{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.stat{padding:20px 22px}.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:30px;font-weight:700;color:var(--deep);margin:5px 0}.stat-note{font-size:12px;color:var(--ok)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px}.panel{padding:24px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.panel h2{font-size:18px;margin:0;color:var(--deep)}.link{border:0;background:transparent;color:var(--blue)}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:10px}.tabs button{border:0;background:transparent;color:var(--muted);padding:10px 0;border-bottom:2px solid transparent}.tabs button.active{color:var(--blue);border-color:var(--blue);font-weight:700}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf2f5;white-space:nowrap}.table th{color:var(--muted);font-size:12px;font-weight:500;background:#fbfdfe}.status{display:inline-block;padding:4px 9px;border-radius:3px;font-size:12px}.status.blue{color:#1769a8;background:#e5f2fa}.status.green{color:#19785f;background:#e0f3eb}.status.orange{color:#a96e13;background:#fff1d8}.status.gray{color:#71808b;background:#eef2f4}.mini-btn{border:0;background:transparent;color:var(--blue);padding:3px 6px}.flow{list-style:none;margin:0;padding:0}.flow li{display:grid;grid-template-columns:30px 1fr;gap:12px;position:relative;padding-bottom:26px}.flow li:not(:last-child):after{content:"";position:absolute;left:14px;top:29px;bottom:0;width:1px;background:#cfe0ea}.dot{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;border:1px solid #b7d1e1;color:var(--blue);background:#fff;z-index:1}.flow li.done .dot{background:var(--blue);color:#fff;border-color:var(--blue)}.flow b{display:block;margin:3px 0;color:var(--deep)}.flow small{color:var(--muted)}.notice{margin-top:20px;padding:14px 16px;background:var(--pale);border-left:3px solid var(--blue);color:#42647a;font-size:13px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{height:40px;border:1px solid var(--line);padding:0 12px;background:#fff;outline:0}.toolbar input{width:260px}.toolbar input:focus,.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0b6fb818}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.form{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}.form-item label{display:block;font-weight:700;margin-bottom:7px}.form-item.wide{grid-column:1/-1}.form textarea{height:90px;width:100%;padding-top:10px}.form select,.form input{width:100%}.form-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:25px;padding-top:20px;border-top:1px solid var(--line)}.api-note{font-size:12px;color:var(--muted);margin-top:8px}.toast{position:fixed;right:30px;bottom:28px;background:var(--deep);color:#fff;padding:13px 18px;box-shadow:var(--shadow);z-index:5}
@media(max-width:900px){.login{grid-template-columns:1fr}.brand-panel{min-height:340px;padding:30px 8vw}.brand-copy{margin-top:30px}.brand-copy h1{font-size:30px}.lighthouse{bottom:14%;right:18%}.login-main{padding:28px}.app{grid-template-columns:1fr}.sidebar{display:none}.content{padding:26px 20px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.topbar{padding:0 20px}.form{grid-template-columns:1fr}}
/* 交互组件：供前端 AI 参考按钮、弹窗、表单反馈和状态层级 */
.btn,.mini-btn,.link,.nav button{transition:all .18s ease}.btn{border-radius:5px;font-weight:600;letter-spacing:.02em}.btn:hover{border-color:#82b6d3;color:var(--blue);transform:translateY(-1px);box-shadow:0 5px 12px #0b477812}.btn.primary:hover{background:#095b98;color:#fff;border-color:#095b98}.btn:active{transform:translateY(0);box-shadow:none}.mini-btn{border:1px solid #c9dce7;border-radius:4px;background:#fff;margin-right:5px;padding:5px 10px;font-size:12px}.mini-btn:hover{background:#eaf5fb;border-color:#83bbd8}.link{border-radius:4px;padding:4px 7px}.link:hover{background:#eaf5fb}.nav button.disabled{color:#7f9aaa;cursor:not-allowed;opacity:.72}.nav button.disabled:hover{background:#0b4778}.nav button em{float:right;font-size:10px;font-style:normal;color:#a7c6d6;border:1px solid #789db2;border-radius:10px;padding:1px 6px}.demo-title{margin-top:24px;color:#7892a1;font-size:12px;text-align:center}.demo-accounts{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:10px}.demo-accounts button{border:1px solid #cfe0e8;background:#f7fbfd;color:#276887;border-radius:14px;padding:5px 10px;font-size:11px}.demo-accounts button:hover{background:#e6f4fb;border-color:#75afd0}.empty-state{text-align:center;padding:80px 30px}.empty-icon{margin:0 auto 15px;width:52px;height:52px;border:1px solid #9fc4d8;border-radius:50%;display:grid;place-items:center;color:var(--blue);font-size:30px}.empty-state h2{font-size:19px;color:var(--deep);margin:8px 0}.empty-state p{color:var(--muted)}.modal-mask{position:fixed;inset:0;background:rgba(5,31,51,.48);display:grid;place-items:center;z-index:20;padding:20px}.modal{width:min(520px,100%);background:#fff;border-radius:8px;box-shadow:0 24px 70px rgba(3,34,58,.28);animation:modalIn .18s ease}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;color:var(--deep);font-size:18px}.modal-close{border:0;background:transparent;color:#8095a2;font-size:22px;line-height:1}.modal-body{padding:22px 24px;color:#526b7b}.modal-body label{display:block;font-weight:700;color:var(--ink);margin-bottom:8px}.modal-body textarea{width:100%;height:100px;border:1px solid var(--line);padding:10px;resize:vertical;outline:0}.modal-body textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0b6fb818}.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line)}.modal-foot .btn{min-width:82px}.required{color:var(--danger);margin-left:3px}@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
/* 交互与配色微调：蓝色为主，橙色仅用于重点行动和提醒 */
.btn{height:34px;padding:7px 12px;font-size:13px}.btn.primary{width:auto;height:34px;padding:7px 14px}.login-card .primary{height:46px;width:100%;font-size:14px}.mini-btn{padding:4px 8px;font-size:11px}.content{padding:30px 38px}.page-head{margin-bottom:20px}.page-head h1{font-size:27px;margin:5px 0}.page-head p{font-size:13px}.eyebrow{font-size:11px}.panel{padding:20px}.panel h2{font-size:16px}.stat{padding:16px 18px}.stat-value{font-size:25px}.stat-label{font-size:12px}.table th,.table td{padding:10px 8px;font-size:13px}.table th{font-size:11px}.toolbar input{width:220px;height:36px}.toolbar select,.toolbar .btn{height:36px}.form{gap:15px 20px}.form-item label{font-size:13px;margin-bottom:5px}.form input,.form select{height:36px;font-size:13px}.form textarea{height:80px;font-size:13px}.topbar{height:64px;padding:0 30px}.user select{height:30px;border:1px solid var(--line);color:var(--ink);background:#fff;padding:0 7px;font-size:12px}.loading-panel{background:#fff;border:1px solid var(--line);padding:40px;text-align:center;color:var(--muted)}
/* 橙色辅助色：控制在 CTA、待处理状态和视觉焦点，避免喧宾夺主 */
:root{--accent:#e58a2b;--accent-soft:#fff1dc}.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn.accent:hover{background:#c97018;border-color:#c97018;color:#fff}.status.orange{color:#a35e0d;background:var(--accent-soft)}.notice{border-left-color:var(--accent)}.demo-accounts button:hover{color:#a35e0d;border-color:#e5ad70;background:var(--accent-soft)}
</style>

<body>
<div id="root"></div>
<script>
const api='/api/v1';
const state={screen:'login',page:'dashboard',creatorIdentity:'UNVERIFIED'};
const orgs=[{id:'10001',name:'泉州城市运营中心',code:'350500'},{id:'10002',name:'厦门城市运营中心',code:'350200'}];
function login(){return `<main class="login"><section class="brand-panel"><div class="brand-mark"><i class="symbol"></i><div><div class="brand-name">星衍树</div><div class="brand-en">XINGYANSHU · CULTURE RIGHTS</div></div></div><div class="brand-copy"><h1>让文化<br>走向更大的海</h1><p>链接创意　激活价值　共建可持续的文化未来</p></div><div class="lighthouse"><i class="light"></i><i class="lamp"></i><i class="tower"></i><i class="shore"></i></div><div class="brand-meta"><strong>文化如海 · 生生不息</strong>版权连接未来 · 创意照亮世界</div></section><section class="login-main"><form class="login-card" onsubmit="event.preventDefault();enter()"><div class="eyebrow">CULTURE RIGHTS PLATFORM</div><h2>欢迎登录星衍树</h2><p class="subtitle">版权资产运营与授权交易平台</p><div class="field"><label>账号</label><div class="input-wrap"><input id="account" placeholder="请输入账号" autocomplete="username" required></div></div><div class="field"><label>密码</label><div class="input-wrap"><input type="password" placeholder="请输入密码" autocomplete="current-password" required></div></div><div class="field"><label>图形验证码</label><div class="captcha-row"><div class="input-wrap"><input placeholder="请输入验证码" required></div><div class="captcha">A7K3</div><button type="button" class="icon-btn" onclick="toast('演示：调用 GET /auth/captcha 刷新验证码')">↻</button></div></div><button class="primary" type="submit">登录</button><div class="login-links"><button type="button" class="link" onclick="toast('演示：进入短信找回密码流程')">忘记密码？</button><button type="button" class="link" onclick="toast('账号由平台管理员建立并线下通知初始密码')">账号使用说明</button></div><div class="login-foot">守护创意　·　连接价值　·　共赴未来</div></form></section></main>`}
const baseLogin=login;
login=function(){return baseLogin().replace('id="account" placeholder="请输入账号"','id="account" value="demo_admin" placeholder="请输入账号"').replace('type="password" placeholder="请输入密码"','type="password" value="Admin@123456" placeholder="请输入密码"').replace('<input placeholder="请输入验证码" required>','<input value="A7K3" placeholder="请输入验证码" required>').replace('守护创意　·　连接价值　·　共赴未来','演示账号已预填　·　实际登录不传 loginType')};
function shell(){return `<main class="app"><aside class="sidebar"><div class="side-logo"><div class="brand-name">星衍树</div><small>文化版权运营平台</small></div><div class="nav-title">工作台</div><nav class="nav"><button class="${state.page==='dashboard'?'active':''}" onclick="go('dashboard')"><span>◆</span>资产总览</button><button class="${state.page==='ips'?'active':''}" onclick="go('ips')"><span>◇</span>IP 资产管理</button><button onclick="toast('授权交易模块待开发')"><span>◈</span>授权交易</button><button onclick="toast('内容发布模块待开发')"><span>□</span>商城管理</button></nav><div class="nav-title">平台管理</div><nav class="nav"><button onclick="toast('演示：打开组织管理')"><span>○</span>账号与组织</button><button onclick="toast('演示：打开平台配置')"><span>⚙</span>系统设置</button></nav><div class="side-bottom">让文化走向更大的海<br><small>CREATIVE RIGHTS<br>A BRIGHTER TOMORROW</small></div></aside><section class="main"><header class="topbar"><div class="crumb">首页　/　${state.page==='ips'?'IP 资产管理':'资产总览'}</div><div class="user"><span>平台管理员</span><span class="avatar">张</span><button class="link" onclick="state.screen='login';render()">退出</button></div></header><div class="content">${state.page==='ips'?ipPage():dashboard()}</div></section></main>`}
function dashboard(){return `<div class="page-head"><div><div class="eyebrow">CULTURE RIGHTS · OVERVIEW</div><h1>IP 资产总览</h1><p>汇聚优质文化 IP，贯通确权、审核与授权交易全流程。</p></div><div class="date">2026 年 9 月 14 日　星期一</div></div><div class="stats"><div class="stat"><div class="stat-label">IP 资产总数</div><div class="stat-value">1,286</div><div class="stat-note">较上月　+12%</div></div><div class="stat"><div class="stat-label">待审核 IP</div><div class="stat-value">62</div><div class="stat-note">较上月　-18%</div></div><div class="stat"><div class="stat-label">已确权 IP</div><div class="stat-value">398</div><div class="stat-note">较上月　+26%</div></div><div class="stat"><div class="stat-label">在售授权数</div><div class="stat-value">276</div><div class="stat-note">较上月　+14%</div></div></div><div class="grid"><section class="panel"><div class="panel-head"><div><h2>待审核 IP</h2><span class="api-note">数据来源：GET /compliance/ips/pending</span></div><button class="link" onclick="go('ips')">查看全部　›</button></div><div class="tabs"><button class="active">全部　62</button><button>待确权　28</button><button>待 DCI　18</button><button>资料补充　6</button></div><div class="table-wrap"><table class="table"><thead><tr><th>IP 编号</th><th>IP 名称</th><th>确权状态</th><th>DCI 状态</th><th>商城状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${rows()}</tbody></table></div></section><aside><section class="panel"><div class="panel-head"><h2>审核流程</h2><button class="link">查看详情 ›</button></div><ol class="flow"><li class="done"><i class="dot">1</i><div><b>提交申请</b><small>权利人提交 IP 相关资料</small></div></li><li class="done"><i class="dot">2</i><div><b>资料初审</b><small>审核内容完整性与合规性</small></div></li><li><i class="dot">3</i><div><b>版权确权审核</b><small>法务与版权专家复核</small></div></li><li><i class="dot">4</i><div><b>确权并自动上架</b><small>取得存证成功回执后开放商城</small></div></li></ol></section><div class="notice">有 6 个 IP 的资料即将超过处理时限，请及时查看。</div></aside></div>`}
function rows(){return [['IP202409001','洛阳桥文化记忆','待审核','未申请','未上架'],['IP202409002','闽南古厝纹样','已确权','审核中','未上架'],['IP202409003','海丝茶文化','待审核','已登记','待上架'],['IP202409004','泉州提线木偶','已确权','已完成','在售'],['IP202409005','南音古韵','待审核','审核中','未上架']].map((r,i)=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td><span class="status ${r[2]==='已确权'?'green':'blue'}">${r[2]}</span></td><td><span class="status ${r[3]==='审核中'?'orange':r[3]==='已完成'?'green':'gray'}">${r[3]}</span></td><td><span class="status ${r[4]==='在售'?'green':r[4]==='待上架'?'orange':'gray'}">${r[4]}</span></td><td>2026-09-${14-i} 14:26</td><td><button class="mini-btn" onclick="toast('演示：查看 ${r[0]} 详情')">查看</button><button class="mini-btn" onclick="toast('演示：进入审核流程')">审核</button></td></tr>`).join('')}

function closeModal(){document.querySelector('.modal-mask')?.remove()}
function showModal(title,body,confirmText='确定',onConfirm=()=>{}){closeModal();document.body.insertAdjacentHTML('beforeend',`<div class="modal-mask" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>${title}</h3><button class="modal-close" aria-label="关闭" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="modalConfirm">${confirmText}</button></div></section></div>`);document.getElementById('modalConfirm').onclick=()=>{onConfirm();closeModal()}}
function actionModal(action,endpoint,needReason=true){showModal(action+' IP',needReason?`<p>该操作会改变商城状态，请填写业务原因后提交。</p><label>操作原因<span class="required">*</span></label><textarea id="actionReason" placeholder="请输入至少 5 个字的原因"></textarea><div class="api-note">接口：${endpoint}</div>`:`<p>请确认执行“${action}”操作。</p><div class="api-note">接口：${endpoint}</div>`, '确认提交',()=>{const reason=document.getElementById('actionReason')?.value||'';if(needReason&&reason.trim().length<5){toast('请填写至少 5 个字的操作原因');return}toast('已提交'+action+'申请（演示）')})}

function planPage(){return `<div class="page-head"><div><div class="eyebrow">AUTHORIZATION PLAN · B04</div><h1>授权方案管理</h1><p>配置授权范围、期限、名额和内容规则；分账模板作为独立主数据，在具体 IP 入库与确权时选择。</p></div><button class="btn primary" onclick="go('plan-new')">＋ 新增授权方案</button></div><section class="panel"><div class="toolbar"><input placeholder="搜索授权方案名称"><select><option>全部状态</option><option>启用</option><option>停用</option></select><button class="btn primary" onclick="toast('演示：GET /auth-plans 查询')">查询</button></div><div class="table-wrap"><table class="table"><thead><tr><th>方案名称</th><th>授权方式</th><th>授权期限</th><th>内容类型</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td><b>普通分账授权</b></td><td>非独家</td><td>12 个月</td><td>商品销售</td><td><span class="status green">启用</span></td><td><button class="mini-btn" onclick="toast('演示：编辑授权方案')">编辑</button></td></tr><tr><td><b>独家买断授权</b></td><td>独家</td><td>36 个月</td><td>商品销售</td><td><span class="status green">启用</span></td><td><button class="mini-btn" onclick="toast('演示：编辑授权方案')">编辑</button></td></tr></tbody></table></div></section>`}

  document.querySelector('.content').innerHTML=`<div class="page-head"><div><div class="eyebrow">CITY IP · CREATE · B02</div><h1>新增 IP</h1><p>一次保存 IP；如需 DCI 代办，在本表单勾选后与 IP 同一事务提交。</p></div><button class="btn" onclick="go('${back}')">返回列表</button></div><section class="panel"><div class="notice">主归属城市来自 <b>GET /admin/orgs/options</b>，仅选择已启用 CITY 城市组织；提交的是组织 <b>id</b>，不可填写城市名称。</div><div class="form"><div class="form-item"><label>IP 名称 <span class="required">*</span></label><input placeholder="请输入 IP 名称"></div><div class="form-item"><label>主归属城市 <span class="required">*</span></label><select>${orgs.map(o=>`<option value="${o.id}">${o.name}（${o.code}）</option>`).join('')}</select><div class="api-note">mainCityOrgId</div></div><div class="form-item wide"><label>IP 基本资料 <span class="required">*</span></label><textarea placeholder="IP 类型、简介、文化故事、权利说明、公开版权说明等按字段规范填写"></textarea></div><div class="form-item"><label>建议交易价（元）<span class="required">*</span></label><input type="number" placeholder="确权时确认并锁定"></div><div class="form-item"><label>评估建议价格（元）</label><input type="number" placeholder="仅评估报告参考，可不填"></div><div class="form-item"><label>DCI 证书编号</label><input id="dciCertificateNo" oninput="certificateEntered()" placeholder="dciCertificateNo"></div><div class="form-item"><label>DCI 证书文件</label><input id="dciCertificateFileId" type="file" onchange="certificateEntered()"><div class="api-note">dciCertificateFileId</div></div><div class="form-item wide"><label><input id="dciAssistanceRequested" type="checkbox" onchange="toggleCreateDCI()"> 申请 DCI 代办</label><div class="api-note">请求字段：dciAssistanceRequested。与 DCI 证书编号、证书文件互斥。</div></div><div id="dciAssistanceFields" class="form-item wide" style="display:none"><label>DCI 代办联系人资料</label><div class="form"><div class="form-item"><label>联系人姓名 <span class="required">*</span></label><input placeholder="dciAssistanceRequest.contactName"></div><div class="form-item"><label>联系人手机号 <span class="required">*</span></label><input placeholder="dciAssistanceRequest.contactMobile"></div><div class="form-item"><label>方便联系时间</label><input placeholder="dciAssistanceRequest.preferredContactTime"></div><div class="form-item"><label>代办说明</label><input placeholder="dciAssistanceRequest.requestNote"></div></div></div></div><div class="form-footer"><button class="btn" onclick="go('${back}')">取消</button><button class="btn accent primary" onclick="toast('演示：POST /ips；保存 IP，并在勾选代办时同一事务创建 DCI 代办申请')">保存 IP</button></div></section>`;
}
function toggleCreateDCI(){const checked=document.getElementById('dciAssistanceRequested').checked;const no=document.getElementById('dciCertificateNo');const file=document.getElementById('dciCertificateFileId');document.getElementById('dciAssistanceFields').style.display=checked?'block':'none';no.disabled=checked;file.disabled=checked;if(checked){no.value='';file.value=''}toast(checked?'已选择 DCI 代办：联系人姓名、手机号必填':'可填写或上传 DCI 证书')}
function certificateEntered(){const no=document.getElementById('dciCertificateNo');const file=document.getElementById('dciCertificateFileId');if(no.value||file.files.length){const box=document.getElementById('dciAssistanceRequested');box.checked=false;document.getElementById('dciAssistanceFields').style.display='none';toast('已填写 DCI 证书：已取消 DCI 代办')}
}
