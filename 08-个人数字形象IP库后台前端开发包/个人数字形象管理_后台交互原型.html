<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人数字形象管理｜后台原型</title><style>:root{--navy:#06386c;--blue:#0879d1;--sky:#eef8ff;--line:#dce9f1;--ink:#19374f;--muted:#6c8292;--orange:#e77825;--green:#12765a}*{box-sizing:border-box}body{margin:0;background:#f5f9fc;color:var(--ink);font:14px/1.5 "Microsoft YaHei",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:244px 1fr}.side{background:linear-gradient(#06386c,#07569b);color:#d9efff;padding:24px 15px}.brand{padding:0 12px 24px;border-bottom:1px solid #ffffff24;font-size:22px;font-weight:700}.brand small{display:block;font-size:11px;color:#9dcced;margin-top:5px}.nav-title{font-size:11px;letter-spacing:.14em;color:#9dcced;padding:22px 12px 8px}.nav button{width:100%;border:0;border-radius:4px;background:transparent;color:#d8ecf8;text-align:left;padding:11px 13px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:var(--blue);color:#fff}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.top b{color:var(--navy)}.tag{font-size:12px;padding:4px 9px;background:#e2f3ff;color:#1269a7}.content{padding:30px 38px;max-width:1480px}.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--blue)}h1{font:700 29px/1.3 Georgia,"Songti SC",serif;color:var(--navy);margin:6px 0}p{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stat,.panel{background:#fff;border:1px solid var(--line);box-shadow:0 7px 20px #08345a0b}.stat{padding:18px}.stat label{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:28px;color:var(--navy);margin:4px 0}.panel{padding:20px;margin-top:18px}.toolbar{display:flex;gap:9px;justify-content:space-between;align-items:center;margin-bottom:14px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 13px;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #edf3f7}th{font-size:12px;color:var(--muted);font-weight:500;background:#fbfdff}.status{font-size:12px;padding:3px 8px;background:#e4f6ef;color:var(--green)}.notice{padding:12px 14px;background:#fff4e9;border-left:3px solid var(--orange);color:#87521f;margin-top:18px}.hidden{display:none}@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none}.content{padding:22px}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="app"><aside class="side"><div class="brand">星衍树<small>文化版权运营平台</small></div><div class="nav-title">个人数字形象管理</div><nav class="nav" id="nav"><button data-page="overview" class="active">◉ 管理总览</button><button data-page="rosters">◇ 数字形象名单</button><button data-page="entry">▦ 建档入口与二维码</button><button data-page="profiles">▤ 档案进度</button><button data-page="quality">✓ 人工质检</button><button data-page="deletions">◌ 删除审批</button><button data-page="exports">⇩ 导出管理</button></nav></aside><main class="main"><header class="top"><span>首页 / <b id="crumb">个人数字形象管理</b></span><span class="tag" id="role">CITY_OPERATOR · 城市运营方</span></header><section class="content"><div class="eyebrow">AVATAR MANAGEMENT · A06</div><h1 id="title">个人数字形象管理</h1><p id="desc">名单、建档、档案、质检与删除全流程受控管理。</p><div id="body"></div></section></main></div><script>const pages={overview:{title:'个人数字形象管理',desc:'一级菜单由 MENU_AVATAR_MANAGEMENT 控制；按角色显示可操作范围。',body:`<div class="stats"><div class="stat"><label>待建档名单</label><strong>38</strong><span>城市运营范围</span></div><div class="stat"><label>进行中档案</label><strong>16</strong><span>仅脱敏进度</span></div><div class="stat"><label>待人工质检</label><strong>5</strong><span>平台管理员处理</span></div><div class="stat"><label>待删除审批</label><strong>2</strong><span>平台管理员处理</span></div></div><div class="notice">完整身份证号、原始素材、归档包密码不在城市运营页面展示。名单四列实名核验仍等待后端升级。</div>`},rosters:{title:'数字形象名单',desc:'下载模板、导入名单、查看批次与错误回执。',body:`<div class="panel"><div class="toolbar"><b>职业模特名单</b><span><button class="btn">下载模板</button> <button class="btn primary">导入 .xlsx</button></span></div><table><tr><th>姓名</th><th>手机号</th><th>性别</th><th>建档状态</th><th>操作</th></tr><tr><td>林*</td><td>138****1024</td><td>女</td><td><span class="status">待建档</span></td><td>发送提醒</td></tr><tr><td>陈*</td><td>139****3846</td><td>男</td><td><span class="status">已绑定</span></td><td>查看进度</td></tr></table><div class="notice">当前接口模板为“姓名、手机号、性别”；目标“姓名、身份证号、性别、手机号 + 导入前实名 Mock”待后端实现。</div></div>`},entry:{title:'建档入口与二维码',desc:'维护城市运营联系人，创建、暂停或恢复长期建档二维码。',body:`<div class="panel"><div class="toolbar"><b>泉州城市运营中心</b><button class="btn primary">创建/轮换二维码</button></div><table><tr><th>二维码编号</th><th>状态</th><th>扫码次数</th><th>操作</th></tr><tr><td>AVQR-20261001</td><td><span class="status">启用</span></td><td>86</td><td>暂停</td></tr></table></div>`},profiles:{title:'数字形象档案进度',desc:'仅查看脱敏档案进度和保存期限。',body:`<div class="panel"><div class="toolbar"><b>本城市档案</b><button class="btn">导出进度</button></div><table><tr><th>档案编号</th><th>采集状态</th><th>质检状态</th><th>归档状态</th><th>保存截止日</th></tr><tr><td>AVP-20261001</td><td>已提交</td><td>自动质检中</td><td>未归档</td><td>—</td></tr><tr><td>AVP-20261002</td><td>已通过</td><td>已通过</td><td><span class="status">已归档</span></td><td>2027-10-18</td></tr></table></div>`},quality:{title:'数字形象人工质检',desc:'仅平台管理员可申请一次性预览并提交审核决定。',body:`<div class="panel"><div class="toolbar"><b>质检待办</b><button class="btn orange">处理选中项</button></div><table><tr><th>档案编号</th><th>复核类型</th><th>状态</th><th>操作</th></tr><tr><td>AVP-20261001</td><td>抽检</td><td>待处理</td><td>申请预览 / 审核</td></tr></table><div class="notice">预览令牌仅一次有效、5 分钟过期；不得持久化保存。</div></div>`},deletions:{title:'数字形象删除审批',desc:'处理本人删除申请及法定保留例外。',body:`<div class="panel"><table><tr><th>申请编号</th><th>档案编号</th><th>申请时间</th><th>状态</th><th>操作</th></tr><tr><td>AVDR-20261001</td><td>AVP-20261001</td><td>2026-10-20</td><td>待审批</td><td>删除 / 拒绝 / 法定保留</td></tr></table></div>`},exports:{title:'导出管理',desc:'城市导出脱敏进度；平台管理员生成加密归档包。',body:`<div class="panel"><div class="toolbar"><b>导出任务</b><span><button class="btn primary">导出进度</button> <button class="btn orange">创建归档包</button></span></div><table><tr><th>任务编号</th><th>类型</th><th>状态</th><th>操作</th></tr><tr><td>AVEX-20261001</td><td>PROGRESS_LIST</td><td><span class="status">已完成</span></td><td>单次下载</td></tr><tr><td>AVEX-20261009</td><td>ARCHIVE_PACKAGE</td><td>处理中</td><td>查看</td></tr></table><div class="notice">归档包为 AES-256 加密 ZIP，密码仅展示一次，遗失后必须重新生成。</div></div>`}};function show(id){let p=pages[id];document.getElementById('title').textContent=p.title;document.getElementById('crumb').textContent=p.title;document.getElementById('desc').textContent=p.desc;document.getElementById('body').innerHTML=p.body;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===id));document.getElementById('role').textContent=['quality','deletions'].includes(id)?'PLATFORM_ADMIN · 平台管理员':'CITY_OPERATOR · 城市运营方'}document.getElementById('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)show(b.dataset.page)};show('overview');</script></body></html>
