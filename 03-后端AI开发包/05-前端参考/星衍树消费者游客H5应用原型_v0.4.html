<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星衍树消费者 H5 原型 v0.4</title>
<style>
:root{--ink:#16221d;--green:#0b6b50;--lime:#d6ed81;--paper:#f6f4ee;--line:#d8d8d0;--muted:#6c756f;--red:#bd4338}*{box-sizing:border-box}body{margin:0;background:#e8e6df;color:var(--ink);font-family:"Microsoft YaHei",Arial,sans-serif}.phone{width:min(100%,420px);min-height:100vh;margin:auto;background:var(--paper);box-shadow:0 0 40px #0002}.head{padding:18px 18px 12px;position:sticky;top:0;background:#f6f4eef2;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5}.brand{display:flex;justify-content:space-between;align-items:center}.brand b{font-size:18px;letter-spacing:0}.brand small{color:var(--muted)}.city{margin-top:12px;display:flex;justify-content:space-between;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:7px}.main{padding:16px 16px 86px}.hero{min-height:150px;padding:22px;background:linear-gradient(135deg,#07543f,#177c59);color:white;border-radius:8px}.hero h1{font-size:25px;margin:0 0 8px}.hero p{line-height:1.6;margin:0;color:#e6f7d2}.chips,.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.chip,.tab{white-space:nowrap;padding:7px 10px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12px}.chip.on,.tab.on{background:var(--ink);color:white;border-color:var(--ink)}h2{font-size:16px;margin:22px 0 10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.row,.panel{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden}.pic{height:96px;background:linear-gradient(145deg,#b6cbb4,#778b73)}.pic.activity{background:linear-gradient(145deg,#e2bc72,#b65d42)}.card .body{padding:10px}.card h3,.row h3{margin:0 0 5px;font-size:14px}.card p,.row p,.panel p{font-size:12px;color:var(--muted);line-height:1.55;margin:0}.price{color:var(--red);font-weight:bold;margin-top:8px}.row{display:flex;padding:10px;gap:10px;margin:9px 0}.row .pic{width:82px;height:82px;flex:0 0 82px;border-radius:5px}.row>div:last-child{flex:1}.panel{padding:13px;margin:10px 0}.kv{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:9px 0;font-size:13px}.kv:last-child{border:0}.btn{border:1px solid var(--ink);background:white;border-radius:5px;padding:9px 11px;font-weight:700;font-size:13px}.btn.primary{background:var(--ink);color:#fff}.btn.full{width:100%;margin-top:10px}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.notice{font-size:12px;line-height:1.6;background:#eef4df;border-left:3px solid #8cae2c;padding:10px;margin:12px 0}.bottom{position:fixed;bottom:0;width:min(100%,420px);background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 4px;z-index:4}.bottom button{border:0;background:none;font-size:12px;color:var(--muted)}.bottom button.on{color:var(--green);font-weight:700}.form label{font-size:12px;display:block;margin:12px 0 5px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);padding:10px;border-radius:5px;background:#fff;font:inherit}.form textarea{height:78px}.hidden{display:none}.status{font-size:12px;color:var(--green);font-weight:700}.warn{color:#a06b07}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#16221d;color:#fff;padding:10px 14px;border-radius:5px;font-size:13px;z-index:9;display:none}
</style></head><body><div class="phone"><header class="head"><div class="brand"><b>星衍树</b><small>消费者 H5 · MVP 基线版</small></div><div class="city"><span id="city">福州市</span><button class="btn" onclick="toast('地区仅影响内容展示，不限制商品购买')">切换地区</button></div></header><main id="app" class="main"></main><nav class="bottom"><button data-nav="home" class="on">首页</button><button data-nav="goods">商品</button><button data-nav="activities">活动</button><button data-nav="mine">我的</button></nav><div id="toast" class="toast"></div></div>
<script>
const goods=[{id:'p1',name:'梅花蔡夫人纹样丝巾',ip:'梅花蔡夫人',price:'268.00',stock:'可购买',area:'福州'},{id:'p2',name:'福州漆艺收纳盒',ip:'福州漆艺',price:'198.00',stock:'已售罄',area:'全国'}];
const activities=[{id:'a1',name:'闽剧文化研学体验',place:'福州闽剧院',time:'2026-10-01 09:00',price:'68.00',state:'报名中'},{id:'a2',name:'漆艺手作体验',place:'福州非遗馆',time:'2026-10-02 14:00',price:'0.00',state:'报名中'}];
let view='home',cart=[{...goods[0],qty:1}],orders=[],bookings=[]; const app=document.querySelector('#app');
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function copyright(){return `<div class="notice"><b>版权说明</b><br>商品/活动基于已授权 IP 创作。购买商品或预约活动不取得 IP、素材或二次使用权。</div>`}
function productCard(p){return `<article class="card"><div class="pic"></div><div class="body"><h3>${p.name}</h3><p>${p.ip} · 展示地区：${p.area}</p><div class="price">¥${p.price}</div><div class="actions"><button class="btn" onclick="openProduct('${p.id}')">查看</button>${p.stock==='可购买'?`<button class="btn primary" onclick="addCart('${p.id}')">加入购物车</button>`:'<span class="status warn">已售罄</span>'}</div></div></article>`}
function activityCard(a){return `<article class="row"><div class="pic activity"></div><div><h3>${a.name}</h3><p>${a.place}<br>${a.time}</p><div class="price">${a.price==='0.00'?'免费预约':'¥'+a.price}</div><div class="actions"><button class="btn primary" onclick="openActivity('${a.id}')">查看并预约</button></div></div></article>`}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===view));if(view==='home')app.innerHTML=`<section class="hero"><h1>在地文化，走进日常</h1><p>浏览公开 IP、文创商品与文旅活动。选择地区后展示相应内容。</p></section><div class="chips"><span class="chip on">商品精选</span><span class="chip">文旅活动</span><span class="chip">福州</span></div><h2>文化商品</h2><div class="grid">${goods.map(productCard).join('')}</div><h2>近期活动</h2>${activities.map(activityCard).join('')}${copyright()}`;
else if(view==='goods')app.innerHTML=`<h2>商品商城</h2><div class="chips"><span class="chip on">全部</span><span class="chip">文化纪念</span><span class="chip">指定地区</span><span class="chip">全国</span></div><div class="grid">${goods.map(productCard).join('')}</div>`;
else if(view==='activities')app.innerHTML=`<h2>文旅活动</h2><div class="chips"><span class="chip on">福州市</span><span class="chip">近期场次</span><span class="chip">免费</span><span class="chip">收费</span></div>${activities.map(activityCard).join('')}`;
else app.innerHTML=`<h2>我的</h2><div class="panel"><b>手机验证码登录</b><p>登录后可查看订单、预约和售后进度。</p><button class="btn primary full" onclick="login()">登录 / 注册</button></div><div class="panel"><b>平台服务电话</b><p>400-000-0000 · 工作日 09:00-18:00</p></div><h2>商品订单</h2>${orders.length?orders.map(o=>`<div class="row"><div class="pic"></div><div><h3>${o.name}</h3><p>${o.no} · ${o.status}</p><div class="actions">${o.status==='待发货'?'<button class="btn" onclick="afterSale(\''+o.no+'\')">申请退款</button>':''}</div></div></div>`).join(''):'<div class="panel"><p>暂无商品订单</p></div>'}<h2>活动预约</h2>${bookings.length?bookings.map(b=>`<div class="row"><div class="pic activity"></div><div><h3>${b.name}</h3><p>${b.no} · 待核销</p><button class="btn primary" onclick="code('${b.no}')">出示核销码</button><button class="btn" onclick="afterSale('${b.no}')">取消/退款</button></div></div>`).join(''):'<div class="panel"><p>暂无活动预约</p></div>'}`}
function openProduct(id){let p=goods.find(x=>x.id===id);view='product';app.innerHTML=`<div class="pic" style="height:210px"></div><h2>${p.name}</h2><p>${p.ip} · ${p.area==='全国'?'全国展示':'指定地区展示'}</p><div class="price">¥${p.price}</div>${copyright()}<div class="panel"><div class="kv"><span>规格</span><b>标准款</b></div><div class="kv"><span>配送方式</span><b>仅物流配送</b></div><div class="kv"><span>售后规则</span><b>固定模板，以订单快照为准</b></div></div>${p.stock==='可购买'?`<div class="actions"><button class="btn" onclick="addCart('${id}')">加入购物车</button><button class="btn primary" onclick="checkout('${id}')">立即购买</button></div>`:'<div class="notice">该商品已售罄，可继续浏览，暂不可下单。</div>'}`}
function addCart(id){let p=goods.find(x=>x.id===id);if(!cart.some(x=>x.id===id))cart.push({...p,qty:1});toast('已加入 Cookie 购物车；库存以结算时为准')}
function checkout(id){let p=goods.find(x=>x.id===id);view='checkout';app.innerHTML=`<h2>确认订单</h2><div class="panel"><b>${p.name}</b><p>标准款 × 1</p><div class="price">¥${p.price}</div></div><div class="form"><label>收货人</label><input value="林先生"><label>手机号码</label><input value="13800000000"><label>收货地址</label><textarea>福建省福州市鼓楼区示例路 1 号</textarea><label>配送方式</label><input value="物流配送" disabled><label>售后规则</label><input value="固定规则模板（下单时快照）" disabled><label><input type="checkbox" id="agree"> 我已阅读并同意订单及售后规则</label><button class="btn primary full" onclick="payGoods('${id}')">提交订单并模拟支付</button></div>`}
function payGoods(id){if(!document.querySelector('#agree').checked)return toast('请先确认订单与售后规则');let p=goods.find(x=>x.id===id);orders.push({no:'OD-'+Date.now().toString().slice(-8),name:p.name,status:'待发货'});view='mine';toast('模拟支付成功，订单进入待发货');render()}
function openActivity(id){let a=activities.find(x=>x.id===id);view='activity';app.innerHTML=`<div class="pic activity" style="height:210px"></div><h2>${a.name}</h2><p>${a.place}<br>${a.time}</p><div class="price">${a.price==='0.00'?'免费预约':'¥'+a.price+' / 人'}</div>${copyright()}<div class="panel"><div class="kv"><span>实际举办地区</span><b>福州市</b></div><div class="kv"><span>场次</span><b>上午场</b></div><div class="kv"><span>票种</span><b>${a.price==='0.00'?'免费票':'成人票'}</b></div><div class="kv"><span>取消/退款规则</span><b>固定模板，以预约快照为准</b></div></div><button class="btn primary full" onclick="book('${id}')">${a.price==='0.00'?'免费预约':'预约并模拟支付'}</button>`}
function book(id){let a=activities.find(x=>x.id===id);bookings.push({no:'BK-'+Date.now().toString().slice(-8),name:a.name});view='mine';toast(a.price==='0.00'?'预约成功，已生成核销码':'模拟支付成功，已生成核销码');render()}
function code(no){view='code';app.innerHTML=`<h2>电子核销码</h2><div class="panel" style="text-align:center;padding:30px"><div style="font-size:30px;letter-spacing:4px;font-weight:bold">HX-${no.slice(-6)}</div><p>仅限待核销预约使用；核销成功后立即失效。</p></div>`}
function afterSale(no){view='after';app.innerHTML=`<h2>售后申请</h2><div class="notice">商品仅支持取消退款或退货退款；活动仅支持取消/退款。已核销或已过期活动不可退款。</div><div class="form"><label>关联单据</label><input value="${no}" disabled><label>售后类型</label><select><option>取消退款</option><option>退货退款（仅商品）</option></select><label>原因</label><select><option>不想要了</option><option>商品问题</option><option>其他</option></select><label>说明</label><textarea></textarea><button class="btn primary full" onclick="toast('申请已提交，等待履约客服处理')">提交申请</button></div>`}
function login(){toast('演示：短信验证码登录成功');}document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;render()});render();
</script></body></html>
