:space-between;align-items:center;gap:10px;margin-top:18px}.lock{color:#9d6808;font-size:12px}.required{color:var(--red);margin-left:3px}.hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:5px}.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px}.checks label{display:flex!important;align-items:center;gap:5px;margin:0!important;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:#fafaf7;font-size:12px!important}.checks input{width:auto!important;padding:0!important}.upload{display:flex;gap:8px;align-items:center;padding:8px;border:1px dashed #b9c8bb;border-radius:5px;background:#fafcf8}.upload input{border:0!important;padding:0!important}.section-note{font-size:12px;color:var(--muted);margin:4px 0 10px}.form-footer{position:sticky;bottom:0;background:#fff;border:1px solid var(--line);border-radius:7px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -4px 16px #18211d10}.form-footer .actions{margin:0}@media(max-width:780px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.content{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.top{padding:0 16px}.form-footer{align-items:flex-start;flex-direction:column}}

let planTab='授权方案',selectedTemplate='NORMAL_SHARE';
function templateItems(){return selectedTemplate==='BUYOUT_FEE'?['原始 IP 权益方','城市运营','平台']:['原始 IP 权益方','城市运营','平台']}
function ratioRows(){return templateItems().map((name,i)=>`<div><label>${name} 期望比例</label><input class="ratio-input" value="${i===0?'60':i===1?'20':'20'}" inputmode="decimal" oninput="updateRatio()"></div>`).join('')}
function updateRatio(){let values=[...document.querySelectorAll('.ratio-input')].map(x=>Number(x.value)||0),total=values.reduce((a,b)=>a+b,0),target=document.querySelector('#ratioTotal');if(target)target.textContent=total.toFixed(2)+'%';let submit=document.querySelector('#ipSubmit');if(submit)submit.disabled=Math.abs(total-100)>0.001}
function setTemplate(type){selectedTemplate=type;let target=document.querySelector('#ratioFields');if(target){target.innerHTML=ratioRows();updateRatio()}document.querySelectorAll('[data-template]').forEach(x=>x.classList.toggle('on',x.dataset.template===type))}
function toggleDciHelp(show){document.querySelector('#dciHelp')?.classList.toggle('hidden',!show)}
function saveIPDraft(){toast('演示：校验必填字段后，创建或更新 DRAFT IP，并上传关联文件')}
function requestDciHelp(){toast('演示：先保存 IP 草稿，再提交 DCI 代办联系人信息')}
function submitIP(){let no=document.querySelector('#dciNo')?.value.trim(),file=document.querySelector('#dciFile')?.files.length,total=Number(document.querySelector('#ratioTotal')?.textContent.replace('%',''));if(!no||!file){toast('提交失败：请填写 DCI 证书编号并上传证书文件');return}if(Math.abs(total-100)>0.001){toast('提交失败：期望分账比例合计必须为 100%');return}toast('演示：资料通过敏感检测后提交版权/合规审核')}
function renderIPForm(){return `<div class="crumb">IP与方案 / 城市运营</div><h1>IP 新建 / 编辑 / 补充材料</h1><div class="notice">带 <span class="required">*</span> 的字段为创建草稿必填项。所有自由输入文本会提交敏感内容检测；DCI 证书可暂缺，但缺失时只能保存草稿或申请代办，不能提交合规审核。</div><div class="panel"><h2>1. 基本信息</h2><div class="form"><div><label>IP 名称<span class="required">*</span></label><input maxlength="200" placeholder="例如：泉州簪花围文化 IP"></div><div><label>IP 类型<span class="required">*</span></label><select><option value="">请选择</option><option>人物形象</option><option>历史文化</option><option>非遗技艺</option><option>地方特产</option><option>景区/地标</option><option>文博资源</option><option>节庆活动</option><option>其他文化资源</option></select></div><div><label>资源来源<span class="required">*</span></label><select><option value="">请选择</option><option>城市运营征集</option><option>政府/机构提供</option><option>权利人提供</option><option>合作机构提供</option><option>历史资料整理</option><option>其他</option></select><div class="hint">选择“其他”时，提交前应补充来源说明。</div></div><div><label>主归属城市<span class="required">*</span></label><select><option value="">从本人可操作城市中选择</option><option>示例城市</option></select></div><div class="wide"><label>一句话简介<span class="required">*</span></label><input maxlength="500" placeholder="用于列表与商城摘要展示，最多 500 字"></div><div class="wide"><label>完整介绍<span class="required">*</span></label><textarea maxlength="10000" placeholder="多行文本：介绍 IP 的起源、内容、文化价值与现状，最多 10000 字"></textarea></div><div class="wide"><label>文化背景和故事<span class="required">*</span></label><textarea maxlength="10000" placeholder="多行文本：记录文化脉络、历史背景与故事"></textarea></div><div class="wide"><label>IP 特色<span class="required">*</span></label><textarea maxlength="5000" placeholder="多行文本：提炼视觉、文化、故事或商业化特色"></textarea></div></div></div><div class="panel"><h2>2. 商城展示与创作范围</h2><div class="form"><div><label>封面图 / 缩略图<span class="required">*</span></label><div class="upload"><input type="file" accept="image/*"><span class="hint">上传后使用返回的 fileId</span></div></div><div><label>详情图</label><div class="upload"><input type="file" accept="image/*" multiple><span class="hint">可多选并排序</span></div></div><div class="wide"><label>可创作方向<span class="required">*</span></label><div class="checks"><label><input type="checkbox">文创商品</label><label><input type="checkbox">文旅活动</label><label><input type="checkbox">数字内容</label><label><input type="checkbox">宣传展示</label></div></div><div><label>适用商品类型<span class="required">*</span></label><div class="checks"><label><input type="checkbox">文创纪念品</label><label><input type="checkbox">服饰配件</label><label><input type="checkbox">家居生活</label><label><input type="checkbox">食品礼盒</label><label><input type="checkbox">数字内容衍生品</label><label><input type="checkbox">其他</label></div></div><div><label>适用文旅活动类型<span class="required">*</span></label><div class="checks"><label><input type="checkbox">展览展示</label><label><input type="checkbox">研学体验</label><label><input type="checkbox">演艺活动</label><label><input type="checkbox">主题市集</label><label><input type="checkbox">节庆活动</label><label><input type="checkbox">其他</label></div></div><div class="wide"><label>标签</label><div class="checks"><label><input type="checkbox">地域标签：闽南</label><label><input type="checkbox">文化标签：非遗</label><label><input type="checkbox">品类标签：服饰</label><label><input type="checkbox">商业化标签：可授权</label></div><div class="hint">实际页面从平台标签库搜索、多选；没有合适标签时由平台管理员新增。</div></div><div class="wide"><label>面向创作者版权说明<span class="required">*</span></label><textarea maxlength="5000" placeholder="多行文本：以通俗文字说明创作者可使用范围与限制"></textarea></div><div class="wide"><label>购买须知<span class="required">*</span></label><textarea maxlength="5000" placeholder="多行文本：说明购买、合同、期限及其他注意事项"></textarea></div></div></div><div class="panel"><h2>3. 主归属与原始权利人</h2><div class="form"><div><label>权利人类型<span class="required">*</span></label><select><option value="">请选择</option><option>个人</option><option>企业</option><option>机构</option><option>集体组织</option></select></div><div><label>权利人名称<span class="required">*</span></label><input maxlength="256" placeholder="一个 IP 只能登记一位原始权利人"></div><div><label>权利取得方式<span class="required">*</span></label><select><option value="">请选择</option><option>原始创作</option><option>受让取得</option><option>授权取得</option><option>继承取得</option><option>委托管理</option><option>其他合法取得</option></select></div><div class="wide"><label>权属说明<span class="required">*</span></label><textarea maxlength="10000" placeholder="多行文本：说明权利来源、范围及可授权边界"></textarea></div></div></div><div class="panel"><div class="subhead"><h2>4. 版权证明材料</h2><button class="btn" onclick="toast('演示：增加一组版权证明字段')">增加证明</button></div><div class="form"><div><label>证明类型<span class="required">*</span></label><select><option>著作权登记证书</option><option>商标注册证明</option><option>授权书/许可协议</option><option>转让协议</option><option>历史文献/档案</option><option>其他权属证明</option></select></div><div><label>证明编号<span class="required">*</span></label><input maxlength="128" placeholder="填写证书或协议编号"></div><div><label>有效起始日</label><input type="date"></div><div><label>有效截止日</label><input type="date"></div><div class="wide"><label>证明文件<span class="required">*</span></label><div class="upload"><input type="file"><span class="hint">至少上传一份，上传成功后关联 fileId</span></div></div></div></div><div class="panel"><h2>5. DCI 版权证书与代办</h2><div class="form"><div><label>DCI 证书编号</label><input id="dciNo" maxlength="128" placeholder="提交审核时必填"></div><div><label>DCI 证书文件</label><div class="upload"><input id="dciFile" type="file" accept=".pdf,image/*"><span class="hint">提交审核时必传</span></div></div><div class="wide"><label><input type="checkbox" checked onchange="toggleDciHelp(this.checked)"> 尚未取得 DCI 证书，申请平台协助代办</label></div></div><div id="dciHelp" class="form"><div><label>联系人<span class="required">*</span></label><input maxlength="100"></div><div><label>联系电话<span class="required">*</span></label><input maxlength="32" placeholder="加密保存，仅合规人员联系时完整读取"></div><div><label>方便联系时间</label><select><option>工作日上午</option><option>工作日下午</option><option>工作日晚上</option><option>其他</option></select></div><div class="wide"><label>补充说明</label><textarea maxlength="500" placeholder="例如：请协助申请 DCI 版权证书"></textarea></div></div></div><div class="panel"><h2>6. 评估报告（可选）</h2><div class="form"><div><label>报告编号</label><input maxlength="128"></div><div><label>评估机构</label><input maxlength="256"></div><div><label>评估日期</label><input type="date"></div><div><label>有效期至</label><input type="date"></div><div class="wide"><label>报告文件</label><div class="upload"><input type="file" accept=".pdf,image/*,.doc,.docx,.xls,.xlsx"><span class="hint">城市运营可一并上传；版权/合规也可在后续审核补传</span></div></div></div></div><div class="panel"><h2>7. 授权方案与期望分账</h2><div class="section-note">固定授权方案和分账结构模板仅显示已启用项。模板只定义参与方，具体比例属于当前 IP，确权后由版权/合规冻结。</div><div class="form"><div><label>固定授权方案<span class="required">*</span></label><select><option>普通授权方案（12个月）</option><option>独家买断方案</option></select></div><div><label>分账结构模板<span class="required">*</span></label><select onchange="setTemplate(this.value)"><option value="NORMAL_SHARE">普通授权三方分账结构</option><option value="BUYOUT_FEE">独家买断费用分配结构</option></select></div></div><div class="subhead"><h2>IP 专属期望分账比例</h2><span class="readonly">模板参与方全部必填</span></div><div id="ratioFields" class="form">${ratioRows()}</div><div class="actions"><span class="ratio">合计 <span id="ratioTotal">100.00%</span></span><span class="lock">合计必须为 100%，否则不能提交审核</span></div></div><div class="panel"><h2>8. 提交审核</h2><div class="form"><div class="wide"><label>提交说明<span class="required">*</span></label><textarea maxlength="500" placeholder="例如：资料齐全，申请版权/合规审核"></textarea></div></div></div><div class="form-footer"><span class="hint">保存草稿后可继续编辑；确权前均可补充材料。提交后进入待版权/合规审核。</span><div class="actions"><button class="btn" onclick="saveIPDraft()">保存草稿</button><button class="btn" onclick="requestDciHelp()">申请 DCI 代办</button><button id="ipSubmit" class="btn primary" onclick="submitIP()">提交审核</button></div></div>`}
function openSimpleModal(title,body,action){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="box"><h2>${title}</h2>${body}<div class="actions"><button class="btn primary" onclick="toast('${action}：演示请求已构建，实际前端应带鉴权、版本或幂等请求头');closeModal()">保存</button><button class="btn" onclick="closeModal()">取消</button></div></div></div>`)}

function pageHtml(p){if(p.render)return p.render();let fields=pageFields(p),actions=pageActions(p);let tabs=p.tabs?`<div class="tabs">${Object.keys(p.tabs).map(tab=>`<button class="${tab===configTab?'on':''}" onclick="setConfigTab('${tab}')">${tab}</button>`).join('')}</div>`:'';let cards=fields.slice(0,4).map((x,i)=>`<div class="stat"><span>${x}</span><b>${i===0?'12':'—'}</b></div>`).join('');let rows=['示例记录 A','示例记录 B','示例记录 C'].map((n,i)=>`<tr><td>${n}</td>${fields.slice(0,Math.min(5,fields.length)).map((f,j)=>`<td>${j===fields.length-1?statusFor(f):f+' '+(i+1)}</td>`).join('')}<td>${actions.slice(0,2).map(a=>`<button class="btn" onclick="act('${a}')">${a}</button>`).join(' ')}</td></tr>`).join('');let searchPlaceholder=p.title==='IP 列表与查询'?'搜索 IP 编号或名称':'关键词 / 编号';return `<div class="crumb">${p.group}</div><h1>${p.title}</h1><div class="notice">${p.note}</div>${tabs}<div class="stats">${cards}</div><div class="tools"><input placeholder="${searchPlaceholder}"><select><option>全部状态</option><option>处理中</option><option>已完成</option><option>已退回</option></select><button class="btn primary" onclick="openForm('${p.title}')">${actions[0]||'新增'}</button><button class="btn">查询</button></div><div class="table"><table><thead><tr>${fields.slice(0,Math.min(5,fields.length)).map(f=>`<th>${f}</th>`).join('')}<th>操作</th></tr></thead><tbody>${rows}</tbody></table></div><h2>页面字段与可执行动作</h2><div class="panel"><div class="form">${fields.map(f=>`<div><label>${f}</label><input value="${f}（示例）" disabled></div>`).join('')}</div><div class="actions">${actions.map(a=>`<button class="btn ${/提交|确认|通过|创建|发货|核销/.test(a)?'primary':''}" onclick="act('${a}')">${a}</button>`).join('')}</div></div>`}
function setConfigTab(tab){configTab=tab;render()}function go(id){current=id;render()}function act(a){toast(a+'：演示操作已触发，实际系统需按权限、状态、幂等与审计校验')}
function openForm(title){let p=pages[current],fields=pageFields(p),actions=pageActions(p);document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="box"><h2>${title}</h2><div class="notice">表单选项、必填与状态规则以《页面功能与字段清单.md》为准。所有用户提交的文本将进入敏感内容检测。</div><div class="form">${fields.map((f,i)=>`<div class="${i>fields.length-3?'wide':''}"><label>${f}</label>${/状态|类型|方式|模板|城市|方案/.test(f)?'<select><option>请选择（字典接口提供）</option><option>示例选项</option></select>':/说明|意见|规则/.test(f)?'<textarea></textarea>':'<input>'}</div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="act('${actions[0]}');closeModal()">提交</button><button class="btn" onclick="closeModal()">取消</button></div></div></div>`)}function closeModal(){document.querySelector('#modal')?.remove()}

openTemplateForm=function(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="box"><h2>新增分账结构模板</h2><div class="notice">模板只定义参与方和顺序，所有参与方均为必选；不填写比例。已绑定 IP 的模板不可编辑或停用。</div><div class="form"><div><label>模板编号<span class="required">*</span></label><input maxlength="64" placeholder="DST_NORMAL_001"></div><div><label>模板名称<span class="required">*</span></label><input maxlength="128"></div><div class="wide"><label>模板类型<span class="required">*</span></label><div class="checks"><label><input type="radio" name="templateType" checked>普通授权分账</label><label><input type="radio" name="templateType">独家买断费用分配</label></div></div><div class="wide"><label>参与方<span class="required">*</span></label><div class="checks"><label><input type="checkbox" checked>原始 IP 权益方</label><label><input type="checkbox" checked>城市运营</label><label><input type="checkbox" checked>平台</label><label><input type="checkbox">创作者</label></div><div class="hint">至少选择一方；保存后按当前顺序提交 items[].participantType / sortNo。</div></div></div><div class="actions"><button class="btn primary" onclick="act('创建分账结构模板');closeModal()">创建</button><button class="btn" onclick="closeModal()">取消</button></div></div></div>`) };
openAuthPlanForm=function(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="box"><h2>新增固定授权方案</h2><div class="form"><div><label>方案编号<span class="required">*</span></label><input maxlength="64" placeholder="AUTH_NORMAL_001"></div><div><label>方案名称<span class="required">*</span></label><input maxlength="128"></div><div class="wide"><label>授权方式<span class="required">*</span></label><div class="checks"><label><input type="radio" name="mode" checked>普通分账授权</label><label><input type="radio" name="mode">独家买断授权</label></div></div><div><label>授权期限类型<span class="required">*</span></label><select><option>固定月数</option><option>固定年数</option><option>指定起止日期</option></select></div><div><label>期限值<span class="required">*</span></label><input type="number" min="1" value="12"><span class="hint">指定日期时改为起止日期控件</span></div><div class="wide"><label>授权地区<span class="required">*</span></label><div class="checks"><label><input type="radio" name="region" checked>全国</label><label><input type="radio" name="region">指定地区</label></div><div class="hint">选择指定地区后显示地区搜索多选控件，至少选择一项。</div></div><div class="wide"><label>使用场景<span class="required">*</span></label><div class="checks"><label><input type="checkbox" checked>商品销售</label><label><input type="checkbox">文旅活动</label><label><input type="checkbox">宣传展示</label><label><input type="checkbox">线上内容传播</label><label><input type="checkbox">线下活动物料</label></div></div><div><label>商业化权限<span class="required">*</span></label><div class="checks"><label><input type="radio" name="commercial" checked>允许</label><label><input type="radio" name="commercial">不允许</label></div></div><div><label>二创权限<span class="required">*</span></label><div class="checks"><label><input type="radio" name="derivative" checked>允许</label><label><input type="radio" name="derivative">不允许</label></div></div><div><label>N 创权限<span class="required">*</span></label><div class="checks"><label><input type="radio" name="ncreation">允许</label><label><input type="radio" name="ncreation" checked>不允许</label></div></div><div><label>适用内容类型<span class="required">*</span></label><div class="checks"><label><input type="radio" name="content">仅商品</label><label><input type="radio" name="content">仅文旅活动</label><label><input type="radio" name="content" checked>商品和文旅活动</label></div></div><div><label>授权名额<span class="required">*</span></label><input type="number" min="1" value="100"><span class="hint">独家买断固定为 1</span></div><div><label>授权价格（元）<span class="required">*</span></label><input type="number" min="0" step="0.01" value="199.00"></div><div><label>分账结构模板<span class="required">*</span></label><select><option>搜索并选择已启用匹配模板</option></select></div><div class="wide"><label>方案说明</label><textarea maxlength="2000" placeholder="多行文本，提交后文字检测"></textarea></div></div><div class="actions"><button class="btn primary" onclick="act('创建授权方案草稿');closeModal()">保存草稿</button><button class="btn" onclick="closeModal()">取消</button></div></div></div>`) };
const baseRenderIPForm=renderIPForm;
renderIPForm=function(){return baseRenderIPForm().replace('上传后使用返回的 fileId</span>','仅 JPG/JPEG/PNG/WebP，单张不超过 10MB；上传后使用返回的 fileId</span>').replace('可多选并排序</span>','JPG/JPEG/PNG/WebP，单张不超过 10MB，最多 10 张，可拖拽排序</span>').replace('<div class="wide"><label>标签</label>','<div class="wide"><label>地域 / 文化 / 品类 / 商业化标签</label>').replace('至少上传一份，上传成功后关联 fileId</span>','PDF/JPG/JPEG/PNG，单文件不超过 30MB；至少上传一份，成功后关联 fileId</span>').replace('提交审核时必传</span>','PDF/JPG/JPEG/PNG，单文件不超过 30MB；提交审核时必传</span>').replace('城市运营可一并上传；版权/合规也可在后续审核补传</span>','PDF/DOC/DOCX/XLS/XLSX/JPG/JPEG/PNG，单文件不超过 30MB；城市运营可上传，版权/合规可后续补传</span>').replace('选择“其他”时，提交前应补充来源说明。</div>','选择“其他”时，显示“来源说明”单行文本并设为必填。</div>').replace('选择“其他合法取得”时补充来源说明','选择“其他合法取得”时补充来源说明')};
const baseAdminIPRender=pages.ips.render;
pages.ips.render=()=>baseAdminIPRender().replace('平台管理员可在已确权 IP 的详情操作中执行上架。服务端将校验 DCI、启用方案、关键存证与商城展示资料；上架请求为 POST /ips/{ipId}/list，并携带 If-Match-Version。','确权成功、存证成功且前置条件满足后，系统自动将 IP 置为 LISTED 并开放创作者商城；平台管理员仅查看状态。').replace('<button class="btn" onclick="toast(\'演示：读取上架前置条件\')">上架前置检查</button> <button class="btn primary" onclick="toast(\'演示：调用 POST /ips/{ipId}/list，上架成功后进入创作者商城\')">确认上架</button>','<span class="tag">确权成功后自动上架</span> <button class="btn" onclick="toast(\'演示：填写暂停原因并调用 POST /ips/{ipId}/pause\')">暂停 IP</button> <button class="btn" onclick="toast(\'演示：填写恢复原因并调用 POST /ips/{ipId}/resume\')">恢复 IP</button>');
const baseComplianceRender=pages.ipReview.render;
const adminIPWithActions=pages.ips.render;
pages.ips.render=()=>adminIPWithActions().replace('>恢复 IP</button>','>恢复 IP</button> <button class="btn" onclick="toast(\'演示：填写下架原因并调用 POST /ips/{ipId}/delist\')">下架 IP</button>');
pages.ipReview.render=()=>baseComplianceRender().replace('得到 RIGHTS_CONFIRMED 与存证回执后才展示“已确权”','取得存证成功回执后自动进入 LISTED，展示“已确权并已上架”').replace('本迭代不提供商城上架、暂停或下架','确权成功后自动上架；本迭代暂不提供暂停、恢复、下架或风险处置');
showLogin();
</script></body></html>
