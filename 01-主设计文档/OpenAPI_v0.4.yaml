      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /files/{fileId}/download-url:
    post:
      tags: [文件、存证与运维]
      summary: 签发文件短期下载地址
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: fileId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '502': { description: COS 签名下载地址生成失败 } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 短效访问令牌。服务端按当前账号、角色、数据范围和 Token 版本校验。
    providerHmac:
      type: apiKey
      in: header
      name: X-Signature
      description: 外部服务回调使用 HMAC 签名，并同时校验 X-Provider-Code、X-Request-Id、X-Timestamp。
  parameters:
    PageNo:
      name: pageNo
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Keyword:
      name: keyword
      in: query
      schema: { type: string, maxLength: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 写操作唯一键。相同键且相同请求返回首次结果；相同键但请求不同返回 IDEMPOTENCY_CONFLICT。
      schema: { type: string, minLength: 16, maxLength: 128 }
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      description: 乐观锁版本号；与请求体 version 二选一时以请求头优先。
      schema: { type: integer, minimum: 1 }
  responses:
    Ok:
      description: 请求成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
          example: { code: OK, message: 成功, requestId: req_20260903_001, data: {} }
    AdminLoginOk:
      description: 后台登录或刷新会话成功
      content: { application/json: { schema: { $ref: '#/components/schemas/AdminLoginResponse' } } }
    AdminMeOk:
      description: 当前后台账号信息读取成功
      content: { application/json: { schema: { $ref: '#/components/schemas/AdminMeResponse' } } }
    Unauthorized:
      description: 未登录、令牌失效或会话已被撤销
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: AUTH_TOKEN_EXPIRED, message: 登录状态已失效, requestId: req_001 } } }
    Forbidden:
      description: 角色、数据范围或对象归属不足
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: AUTH_FORBIDDEN, message: 无权操作该对象, requestId: req_001 } } }
    NotFound:
      description: 对象不存在；无权访问时返回 AUTH_FORBIDDEN，不暴露资源存在性
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: FILE_NOT_FOUND, message: 文件不存在或不可用, data: { resourceType: FILE, field: coverFileId }, requestId: req_001 } } }
    ValidationError:
      description: 参数校验失败
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: VALIDATION_REQUIRED, message: 参数校验失败, requestId: req_001, fieldErrors: [{ field: ipName, message: 不能为空 }] } } }
    StateConflict:
      description: 当前业务状态不允许操作、乐观锁、幂等或唯一资源冲突
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: STATE_TRANSITION_NOT_ALLOWED, message: 当前状态不允许该操作, data: { currentStatus: LISTED, action: SUBMIT_IP, reasonCode: IP_STATUS_NOT_EDITABLE }, requestId: req_001 } } }
    ExternalUnavailable:
      description: 外部存证服务不可用或尚未返回成功回执，IP 不会进入已确权状态
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: EVIDENCE_NOT_CONFIRMED, message: 存证服务尚未确认, requestId: req_001 } } }
  schemas:
    ApiResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string, example: OK }
        message: { type: string, example: 成功 }
        requestId: { type: string, example: req_20260903_001 }
        timestamp: { type: string, format: date-time }
        data: { type: object, nullable: true, additionalProperties: true }
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string, example: AUTH_FORBIDDEN }
        message: { type: string, example: 无权操作该对象 }
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
        data: { type: object, nullable: true, additionalProperties: true }
        fieldErrors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    PageResult:
      type: object
      required: [items, pageNo, pageSize, total, totalPages]
      properties:
        items: { type: array, items: {} }
        pageNo: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        total: { type: integer, example: 0 }
        totalPages: { type: integer, example: 0 }
    EmptyData:
      type: object
      additionalProperties: false
    IdVersion:
      type: object
      required: [version]
      properties: { version: { type: integer, minimum: 1 } }
    FileIdList:
      type: array
      items: { type: string, description: file_object.file_id }
    Reference:
      type: object
      properties:
        id: { type: string }
        no: { type: string }
        name: { type: string }
        status: { type: string }
        statusName: { type: string }
    SessionTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string, description: 建议仅作为 HttpOnly Secure Cookie 返回；文档保留兼容字段。 }
        expiresIn: { type: integer, example: 7200 }
        tokenType: { type: string, example: Bearer }
    AdminLoginData:
      allOf:
        - $ref: '#/components/schemas/SessionTokens'
        - type: object
          required: [tokenType, user, mustChangePassword]
          properties:
            user: { $ref: '#/components/schemas/AdminCurrentUser' }
            mustChangePassword: { type: boolean, description: 首次登录或管理员重置密码后为 true；为 true 时必须先调用密码修改接口。 }
    AdminCurrentUser:
      type: object
      required: [id, username, displayName, orgId, dataScope, dataScopeName]
      properties:
        id: { type: string, example: '10401' }
        username: { type: string }
        displayName: { type: string }
        orgId: { type: string, example: '10001' }
