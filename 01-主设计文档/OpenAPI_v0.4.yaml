openapi: 3.0.3
info:
  title: 星衍树版权二创平台一期 MVP API
  version: v0.4
  description: |
    统一管理后台与消费者 H5 的一期 API 契约。以《一期MVP需求基线与范围说明》《业务状态机与流转规则》《API接口设计说明》为业务依据。
    数据库不使用物理外键；所有逻辑关联、权限、状态与并发校验由 Go 服务事务完成。
    金额均使用字符串表达的十进制数；业务 ID 均使用字符串，避免 JavaScript 精度丢失。
servers:
  - url: /api/v1
    description: 默认网关前缀
tags:
  - name: 公共与登录
  - name: 创作者认证
  - name: IP与方案
  - name: 授权与合同
  - name: 作品与内容
  - name: 消费者H5
  - name: 履约与售后
  - name: 财务结算
  - name: 文件、存证与运维
security:
  - bearerAuth: []
paths:
  /auth/captcha:
    get:
      tags: [平台账号管理]
      summary: 获取后台图形验证码
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/login:
    post:
      tags: [公共与登录]
      summary: 所有后台角色统一登录
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnifiedLoginRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password-reset/sms/send:
    post:
      tags: [公共与登录]
      summary: 发送后台账号密码找回短信验证码
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetSMSRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '503': { $ref: '#/components/responses/ExternalUnavailable' } }
  /auth/password-reset:
    post:
      tags: [公共与登录]
      summary: 通过短信验证码找回后台账号密码
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '422': { $ref: '#/components/responses/StateConflict' } }
  /auth/password/change:
    post:
      tags: [公共与登录]
      summary: 修改当前后台账号密码
      description: 首次登录或管理员重置后的账号只能访问本接口，修改成功后恢复正常访问。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChangeRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '428': { $ref: '#/components/responses/StateConflict' } }
  /auth/refresh:
    post:
      tags: [公共与登录]
      summary: 刷新后台或创作者会话令牌
      description: "无需 Authorization；只提交当前最新 refreshToken。适用于 ADMIN_WEB 与 CREATOR_WEB，成功后返回新的 accessToken 与 refreshToken，旧刷新令牌立即失效。"
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /auth/logout:
    post:
      tags: [公共与登录]
      summary: 注销当前后台或创作者会话
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /auth/me:
    get:
      tags: [公共与登录]
      summary: 获取当前后台账号或创作者登录态（含角色、权限与可见菜单）
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /admin/accounts:
    get:
      tags: [平台账号管理]
      summary: 查询后台账号列表
      x-roles: [平台管理员]
      parameters:
        - { name: keyword, in: query, schema: { type: string, maxLength: 50 } }
        - { name: orgId, in: query, schema: { type: string } }
        - { name: roleCode, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED] } }
        - { name: pageNo, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [平台账号管理]
      summary: 新增后台账号
      x-roles: [平台管理员]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccountCreateRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/StateConflict' } }
  /admin/accounts/{userId}:
    get:
      tags: [平台账号管理]
      summary: 获取后台账号详情
      x-roles: [平台管理员]
      parameters: [ { name: userId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [平台账号管理]
      summary: 编辑后台账号资料、组织、角色与数据范围
      x-roles: [平台管理员]
      parameters: [ { name: userId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccountUpdateRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/StateConflict' } }
  /admin/accounts/{userId}/status:
    patch:
      tags: [平台账号管理]
      summary: 启用或停用后台账号
      x-roles: [平台管理员]
      parameters: [ { name: userId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminAccountStatusRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/StateConflict' } }
  /admin/accounts/{userId}/password/reset:
    post:
      tags: [平台账号管理]
      summary: 管理员重置后台账号密码
      x-roles: [平台管理员]
      parameters: [ { name: userId, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetByAdminRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/StateConflict' } }
  /admin/orgs/options:
    get:
      tags: [组织管理]
      summary: 获取已启用组织下拉选项
      x-roles: [平台管理员]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/orgs:
    get:
      tags: [组织管理]
      summary: 查询组织列表
      x-roles: [平台管理员]
      parameters:
        - { name: keyword, in: query, schema: { type: string, maxLength: 50 } }
        - { name: orgType, in: query, schema: { type: string, enum: [GROUP, PLATFORM, CITY] } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED] } }
        - { name: pageNo, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [组织管理]
      summary: 新增组织
      x-roles: [平台管理员]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgCreateRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/StateConflict' } }
  /admin/orgs/{orgId}:
    get:
      tags: [组织管理]
      summary: 获取组织详情
      x-roles: [平台管理员]
      parameters: [ { name: orgId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [组织管理]
      summary: 编辑组织名称、上级组织或城市编码
      x-roles: [平台管理员]
      parameters: [ { name: orgId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgUpdateRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/StateConflict' } }
  /admin/orgs/{orgId}/status:
    patch:
      tags: [组织管理]
      summary: 启用或停用组织
      x-roles: [平台管理员]
      parameters: [ { name: orgId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrgStatusRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/StateConflict' } }
  /consumer/auth/sms/send:
    post:
      tags: [公共与登录]
      summary: 发送消费者注册或登录短信验证码
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConsumerSmsRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /auth-plans/{planId}:
    get:
      tags: [IP与方案]
      summary: 查询固定授权方案详情
      x-roles: [平台管理员, 版权合规, 城市运营]
      parameters: [ { name: planId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }
  /auth-plans/{planId}/draft:
    patch:
      tags: [IP与方案]
      summary: 修改草稿或退回的授权方案
      x-roles: [平台管理员]
      parameters: [ { name: planId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuthPlanUpdateRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/StateConflict' } }
  /consumer/auth/login:
    post:
      tags: [公共与登录]
      summary: 消费者短信登录或自动注册
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConsumerLoginRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /consumer/auth/refresh:
    post:
      tags: [公共与登录]
      summary: 刷新消费者会话令牌
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /consumer/auth/logout:
    post:
      tags: [公共与登录]
      summary: 注销消费者会话
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /consumer/me:
    get:
      tags: [公共与登录]
      summary: 获取消费者脱敏资料及业务数量
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /dictionaries/{dictType}:
    get:
      tags: [公共与登录]
      summary: 获取固定公开枚举字典项
      description: 仅允许读取服务端固定白名单枚举（如 IP_TYPE）；无须登录，且不开放任何字典维护能力。
      security: []
      parameters:
        - { name: dictType, in: path, required: true, schema: { type: string } }
        - { name: enabledOnly, in: query, schema: { type: boolean, default: true } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' } }
  /public/regions:
    get:
      tags: [消费者H5]
      summary: 获取公开地区树
      security: []
      parameters:
        - { $ref: '#/components/parameters/Keyword' }
        - { name: level, in: query, description: 推荐传 NATION/PROVINCE/CITY/DISTRICT；服务端兼容大小写及 1/2/3/4, schema: { type: string, enum: [NATION, PROVINCE, CITY, DISTRICT, '1', '2', '3', '4'] } }
        - { name: parentCode, in: query, description: 上级六码地区编码；服务端会去除首尾空格, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /tags:
    get:
      tags: [公共与登录]
      summary: 查询后台标签
      parameters: [ { name: tagType, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Keyword' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /admin/tags:
    get:
      tags: [平台基础配置]
      summary: 查询全部标签（含停用项）
      x-roles: [平台管理员]
      parameters: [ { name: tagType, in: query, schema: { type: string, enum: [REGION, CULTURE, CATEGORY, COMMERCIAL] } }, { $ref: '#/components/parameters/Keyword' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [公共与登录]
      summary: 新建标签
      x-roles: [平台管理员]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TagRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/tags/{tagId}/status:
    patch:
      tags: [公共与登录]
      summary: 启用或停用标签
      x-roles: [平台管理员]
      parameters: [ { name: tagId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EnabledChangeRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/StateConflict' } }
  /admin/activity-ticket-types:
    get:
      tags: [平台基础配置]
      summary: 查询活动票种字典（含停用项）
      x-roles: [平台管理员]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/activity-ticket-types/{ticketTypeCode}:
    patch:
      tags: [平台基础配置]
      summary: 启停或调整活动票种排序
      x-roles: [平台管理员]
      x-idempotency: required
      parameters: [ { name: ticketTypeCode, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled, sortNo, reason], properties: { enabled: { type: boolean }, sortNo: { type: integer, minimum: 0 }, reason: { type: string, maxLength: 500 } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/StateConflict' } }
  /admin/regions:
    get:
      tags: [平台基础配置]
      summary: 查询全部地区主数据（含停用项）
      x-roles: [平台管理员]
      parameters: [ { $ref: '#/components/parameters/Keyword' } ]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
    post:
      tags: [平台基础配置]
      summary: 新建地区主数据
      x-roles: [平台管理员]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegionRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' } }
  /admin/regions/{regionId}/status:
    patch:
      tags: [平台基础配置]
      summary: 启用或停用地区主数据
      x-roles: [平台管理员]
      parameters: [ { name: regionId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EnabledChangeRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/StateConflict' } }
  /admin/configs:
    get:
      tags: [平台基础配置]
      summary: 查询平台基础配置
      x-roles: [平台管理员]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /admin/configs/{configKey}:
    patch:
      tags: [平台基础配置]
      summary: 更新非敏感平台配置
      x-roles: [平台管理员]
      parameters: [ { name: configKey, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConfigUpdateRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' }, '409': { $ref: '#/components/responses/StateConflict' } }
  /admin/after-sale-templates:
    get:
      tags: [平台基础配置]
      summary: 查询固定售后模板及其版本
      x-roles: [平台管理员]
      parameters: [ { name: bizType, in: query, schema: { type: string, enum: [PRODUCT, ACTIVITY] } }, { name: enabledOnly, in: query, schema: { type: boolean, default: false } } ]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [平台基础配置]
      summary: 新建固定售后模板
      x-roles: [平台管理员]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TemplateCreateRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '400': { $ref: '#/components/responses/ValidationError' } }
  /admin/after-sale-templates/{templateId}/versions:
    post:
      tags: [平台基础配置]
      summary: 创建固定售后模板新版本并停用旧版本
      x-roles: [平台管理员]
      parameters: [ { name: templateId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TemplateVersionRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/StateConflict' } }
  /admin/after-sale-templates/{templateId}/status:
    patch:
      tags: [平台基础配置]
      summary: 启用或停用当前固定售后模板版本
      x-roles: [平台管理员]
      parameters: [ { name: templateId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IfMatchVersion' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EnabledChangeRequest' } } } }
