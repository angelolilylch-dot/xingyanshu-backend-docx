      type: object
      required: [planName, authorizationMode, termType, regionMode, scenes, contentType]
      properties: { planName: { type: string, maxLength: 200 }, authorizationMode: { type: string, enum: [NORMAL_SHARE, EXCLUSIVE_BUYOUT] }, termType: { type: string, enum: [MONTH, YEAR, DATE_RANGE] }, termValue: { type: integer, minimum: 1, description: 按月或按年授权必填；指定日期时不传 }, validFrom: { type: string, format: date, description: 指定日期授权必填 }, validTo: { type: string, format: date, description: 指定日期授权必填且不得早于 validFrom }, regionMode: { type: string, enum: [NATIONWIDE, DESIGNATED] }, regionCodes: { type: array, description: 指定地区授权必填；全国授权不传, items: { type: string, pattern: '^[0-9]{6}$' } }, scenes: { type: array, minItems: 1, items: { type: string, enum: [PRODUCT_SALE, ACTIVITY, PROMOTION, ONLINE_CONTENT, OFFLINE_MATERIAL] } }, commercialAllowed: { type: boolean }, derivativeAllowed: { type: boolean }, nCreationAllowed: { type: boolean }, contentType: { type: string, enum: [PRODUCT_ONLY, ACTIVITY_ONLY, PRODUCT_AND_ACTIVITY] }, quotaTotal: { type: integer, minimum: 1, nullable: true, description: 普通授权不传或传 null 表示不限额；独家买断必须为 1 } }
    DistributionTemplateRequest:
      type: object
      required: [distributionNo, distributionName, distributionType, items]
      properties: { distributionNo: { type: string, maxLength: 64 }, distributionName: { type: string, maxLength: 200 }, distributionType: { type: string, enum: [NORMAL_SHARE, BUYOUT_FEE] }, items: { type: array, minItems: 1, items: { type: object, required: [participantType], properties: { participantType: { type: string }, sortNo: { type: integer, minimum: 0 } } } } }
    DistributionTemplateUpdateRequest:
      type: object
      required: [distributionName, items]
      properties: { distributionName: { type: string, maxLength: 200 }, items: { type: array, minItems: 1, items: { type: object, required: [participantType], properties: { participantType: { type: string }, sortNo: { type: integer, minimum: 0 } } } } }
    AuthOrderCreateRequest:
      type: object
      required: [ipId, contractAgreed]
      properties: { ipId: { type: string }, contractAgreed: { type: boolean, enum: [true] } }
    AuthOrderCancelRequest:
      type: object
      properties: { reason: { type: string, maxLength: 500 } }
    MaterialDownloadRequest:
      type: object
      required: [materialItemId]
      properties: { materialItemId: { type: string, description: 冻结素材包明细 ID；服务端按授权订单的素材清单 Hash 校验，不接受 fileId 直传。 } }
    WorkSubmitRequest:
      type: object
      required: [workName, workType, creationDescription, copyrightDeclaration, authorizationId, declarations, newExpressionRatio, newExpressionDimensions, newExpressionDescription, originalIPUsageDescription, previewFileIds, sourceFileIds, materialItemIds]
      properties:
        workName: { type: string, maxLength: 200 }
        workType: { type: string, enum: [IMAGE, VIDEO, GRAPHIC_DESIGN, ARTICLE, MUSIC_AUDIO, OTHER] }
        workIntro: { type: string, maxLength: 2000 }
        creationDescription: { type: string, maxLength: 5000 }
        completedAt: { type: string, format: date-time }
        publicCopyrightNotice: { type: string, maxLength: 2000 }
        copyrightDeclaration: { type: string, maxLength: 2000 }
        authorizationId: { type: string }
        declarations: { type: object, required: [SELF_CREATED, AUTHORIZED_IP_MATERIAL, NO_UNAUTHORIZED_THIRD_PARTY, NO_THIRD_PARTY_RIGHTS_INFRINGEMENT, AUTHENTIC_AND_LAWFUL], additionalProperties: { type: boolean } }
        aiAssisted: { type: boolean }
        aiAssistanceDescription: { type: string }
        coCreatorDescription: { type: string }
        newExpressionRatio: { type: integer, minimum: 51, maximum: 100, description: 平台确权准入自评比例，不是法定版权比例 }
        newExpressionDimensions: { type: array, minItems: 1, items: { type: string } }
        newExpressionDescription: { type: string }
        originalIPUsageDescription: { type: string }
        previewFileIds: { $ref: '#/components/schemas/FileIdList' }
        sourceFileIds: { $ref: '#/components/schemas/FileIdList' }
        processFileIds: { $ref: '#/components/schemas/FileIdList' }
        materialItemIds: { type: array, minItems: 1, items: { type: string } }
    WorkReviewRequest:
      type: object
      required: [reviewNode, result]
      properties: { reviewNode: { type: string, enum: [COPYRIGHT_INITIAL, COMPLIANCE_REVIEW] }, result: { type: string, enum: [PASS, RETURN, REJECT] }, comment: { type: string }, supplementItems: { type: string } }
    WorkRightsConfirmationRequest:
      type: object
      required: [reviewedNewExpressionRatio]
      properties: { reviewedNewExpressionRatio: { type: integer, minimum: 51, maximum: 100, description: 平台内部准入认定，不改变原始IP权属 }, comment: { type: string } }
    ProductCreateRequest:
      type: object
      required: [authorizationId, workId, productName, productType, coverFileId, publicCopyrightNotice, saleRegionMode, fulfillmentMode, freightMode, afterSaleTemplateId, skus]
      properties:
        authorizationId: { type: string }
        workId: { type: string }
        productName: { type: string, maxLength: 100 }
        productIntro: { type: string, maxLength: 2000 }
        productType: { type: string }
        brand: { type: string, maxLength: 200 }
        manufacturer: { type: string, maxLength: 200 }
        barcode: { type: string, maxLength: 128 }
        taxRate: { type: string, pattern: '^\\d+(\\.\\d{1,4})?$' }
        coverFileId: { type: string }
        detailFileIds: { $ref: '#/components/schemas/FileIdList' }
        attachments: { type: array, description: 可选商品视频、说明书、质检报告、生产许可证或其他附件, items: { type: object, required: [fileId, fileType], properties: { fileId: { type: string }, fileType: { type: string, enum: [PRODUCT_VIDEO, MANUAL, QUALITY_REPORT, PRODUCTION_LICENSE, OTHER] } } } }
        publicCopyrightNotice: { type: string, maxLength: 1000 }
        saleRegionMode: { type: string, enum: [NATIONAL, SPECIFIED] }
        saleRegionCodes: { type: array, items: { type: string } }
        fulfillmentMode: { type: string, enum: [CREATOR_SHIP, PLATFORM_SHIP] }
        freightMode: { type: string, enum: [FREE, FIXED] }
        freightAmount: { type: string, pattern: '^\\d+(\\.\\d{1,2})?$' }
        afterSaleTemplateId: { type: string }
        skus:
          type: array
          minItems: 1
          items:
            type: object
            required: [skuName, salePrice, stockTotal]
            properties: { skuCode: { type: string, readOnly: true, description: 后端按 SKU-IP资产编号-关联作品编号-商品编号末6位-顺序号 自动生成 }, skuName: { type: string }, spec: { type: object, additionalProperties: { type: string } }, salePrice: { type: string, pattern: '^\\d+(\\.\\d{1,2})?$' }, stockTotal: { type: integer, minimum: 0 }, skuFileId: { type: string } }
    ProductReviewRequest:
      type: object
      required: [reviewNode, result]
      properties: { reviewNode: { type: string, enum: [COPYRIGHT_INITIAL, COMPLIANCE_REVIEW] }, result: { type: string, enum: [PASS, RETURN, REJECT] }, comment: { type: string }, supplementItems: { type: string } }
    ActivityCreateRequest:
      type: object
      required: [authorizationId, activityName, coverFileId, venueName, mapPointName, longitude, latitude, actualCityCode, publicCopyrightNotice, refundTemplateId, sessions]
      properties:
        authorizationId: { type: string }
        activityName: { type: string, maxLength: 100 }
        activityIntro: { type: string, maxLength: 2000 }
        coverFileId: { type: string }
        venueName: { type: string }
        mapPointName: { type: string }
        longitude: { type: string }
        latitude: { type: string }
        actualCityCode: { type: string, description: 实际举办城市编码，禁止使用全国编码 }
        notice: { type: string, maxLength: 2000 }
        publicCopyrightNotice: { type: string, maxLength: 1000 }
        refundTemplateId: { type: string }
        sessions: { type: array, minItems: 1, items: { type: object, required: [sessionNo, sessionName, startAt, endAt, quotaTotal, tickets], properties: { sessionNo: { type: string }, sessionName: { type: string }, startAt: { type: string, format: date-time }, endAt: { type: string, format: date-time }, quotaTotal: { type: integer, minimum: 1 }, tickets: { type: array, minItems: 1, items: { type: object, required: [ticketTypeCode, chargeType, price, quotaTotal], properties: { ticketTypeCode: { type: string, description: 取值来自 GET /dictionaries/ACTIVITY_TICKET_TYPE }, chargeType: { type: string, enum: [FREE, PAID] }, price: { type: string, pattern: '^\\d+(\\.\\d{1,2})?$' }, quotaTotal: { type: integer, minimum: 1 } } } } } } }
    ProductOrderRequest:
      type: object
